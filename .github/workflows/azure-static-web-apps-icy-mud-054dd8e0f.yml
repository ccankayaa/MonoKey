name: Manual TEST web redeployment
# Main deployment is owned by ci.yml; this preserves a manual portal entry point.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.TEST_WEB_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-test-web.yml
    secrets: inherit
