name: Manual TEST mobile packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native package to build
        type: choice
        options: [all, android, ios-simulator]
        default: all
      android_artifact_run_id:
        description: Optional existing signed-test-apk run ID for verification and redistribution
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: monokey-mobile-test
  cancel-in-progress: false
jobs:
  android:
    if: github.ref == 'refs/heads/main' && vars.TEST_MOBILE_BUILD_ENABLED == 'true' && inputs.platform != 'ios-simulator'
    environment: TestMobile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_APP_ENV: test
      EXPO_PUBLIC_API_BASE_URL: https://monokey-e9ahh8hpfqdah7em.ukwest-01.azurewebsites.net
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: vaultx-1ee62
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: vaultx-1ee62.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.TEST_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.TEST_FIREBASE_MOBILE_APP_ID }}
      MONOKEY_ANDROID_PACKAGE: ${{ vars.TEST_ANDROID_PACKAGE }}
      TEST_ANDROID_CERT_SHA256: ${{ vars.TEST_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - working-directory: apps
        if: inputs.android_artifact_run_id == ''
        run: npm ci --ignore-scripts && npm run build --workspace @monokey/contracts && npm run build --workspace @monokey/crypto
      - working-directory: apps/mobile
        if: inputs.android_artifact_run_id == ''
        run: npx expo prebuild --platform android --no-install
      - shell: pwsh
        id: native_build
        if: inputs.android_artifact_run_id == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TEST_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TEST_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.TEST_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TEST_ANDROID_KEY_PASSWORD }}
        run: ./scripts/Build-MonoKeyAndroid.ps1 -GenerateNative:$false
      - name: Validate an explicitly selected existing native artifact
        if: inputs.android_artifact_run_id != ''
        shell: pwsh
        env:
          ARTIFACT_RUN_ID: ${{ inputs.android_artifact_run_id }}
        run: |
          if ($env:ARTIFACT_RUN_ID -notmatch '^\d+$') { throw 'A numeric workflow run ID is required.' }
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        if: inputs.android_artifact_run_id != ''
        with:
          name: signed-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release
          run-id: ${{ inputs.android_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the signed native package
        shell: pwsh
        run: ./scripts/Test-MonoKeyAndroidPackage.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.native_build.outcome == 'success'
        with:
          name: signed-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Authenticate the TEST distribution identity without private keys
        if: vars.TEST_MOBILE_DISTRIBUTION_ENABLED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: vaultx-1ee62
          workload_identity_provider: ${{ vars.FIREBASE_TEST_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_TEST_DISTRIBUTION_SERVICE_ACCOUNT }}
          audience: https://iam.googleapis.com/${{ vars.FIREBASE_TEST_WORKLOAD_IDENTITY_PROVIDER }}
      - if: vars.TEST_MOBILE_DISTRIBUTION_ENABLED == 'true'
        env:
          FIREBASE_DISTRIBUTION_APP_ID: ${{ vars.TEST_FIREBASE_ANDROID_APP_ID }}
          FIREBASE_DISTRIBUTION_GROUP: ${{ vars.TEST_FIREBASE_TESTER_GROUP }}
        shell: pwsh
        run: ./scripts/Distribute-MonoKeyAndroid.ps1
  ios-simulator:
    if: github.ref == 'refs/heads/main' && vars.TEST_IOS_SIMULATOR_BUILD_ENABLED == 'true' && inputs.platform != 'android'
    environment: TestMobile
    runs-on: macos-15
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_APP_ENV: test
      EXPO_PUBLIC_API_BASE_URL: https://monokey-e9ahh8hpfqdah7em.ukwest-01.azurewebsites.net
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: vaultx-1ee62
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: vaultx-1ee62.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.TEST_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.TEST_FIREBASE_IOS_APP_ID }}
      MONOKEY_IOS_BUNDLE_ID: ${{ vars.TEST_IOS_BUNDLE_ID }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@54337e0d02de9202d0948aaff36ad556375497b9
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/package-lock.json
      - working-directory: apps
        run: npm ci --ignore-scripts && npm run build --workspace @monokey/contracts && npm run build --workspace @monokey/crypto
      - name: Apply the reviewed Expo Swift compatibility backport
        run: node scripts/Apply-MonoKeyExpoIosCompatibility.mjs
      - name: Compile the native iOS simulator application
        shell: pwsh
        run: ./scripts/Build-MonoKeyIosSimulator.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-ios-simulator-app
          path: artifacts/mobile/monokey-test-ios-simulator.zip
          retention-days: 7
